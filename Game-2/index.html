<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Ambidextro: minijuego cooperativo de plataformas para 2 jugadores en el mismo dispositivo. Haz que los dos personajes se toquen a lo largo de 25 niveles." />
  <meta name="theme-color" content="#0a0b12" />
  <title>Ambidextro 3D — PimpoliDev</title>
  <link rel="icon" href="../img/MultiGameInc.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #0a0b12; --bg-1: #0f1a22; --bg-2: #112a2c;
      --surface: #17161f; --surface-2: #1f1d2a;
      --line: #2a2838; --line-strong: #363346;
      --text: #f3f1fa; --muted: #a9a5bd;
      --accent: #7c4dff; --accent-hover: #8f66ff; --accent-text: #a98bff;
      --p1: #ff6b6b; --p1-soft: #ff8f8f; --p2: #4ecdc4; --p2-soft: #8ff0e8;
      --gold: #f1c40f; --danger: #ff5a4f;
      --font-display: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
      --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --top-h: 64px;
      --mc: clamp(44px, 13.2vw, 56px);
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-2) 100%) fixed;
      color: var(--text); font-family: var(--font-body);
      overflow: hidden; overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--accent-text); outline-offset: 3px; }
    .sr-only {
      position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ── Fondo: rejilla en perspectiva (solo visible con el renderizado 2D de reserva) ── */
    #bg-grid {
      position: fixed; left: -40vw; right: -40vw; bottom: -20vh; height: 60vh;
      background-image:
        linear-gradient(rgba(78,205,196,0.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(78,205,196,0.22) 1px, transparent 1px);
      background-size: 64px 64px;
      transform: perspective(700px) rotateX(64deg); transform-origin: 50% 100%;
      opacity: 0.5; pointer-events: none; display: none;
    }
    body.r2d #bg-grid { display: block; }

    /* ── Lienzo ── */
    #c { position: fixed; display: block; opacity: 0; }
    body.r3d #c { inset: 0; width: 100%; height: 100%; opacity: 1; }
    body.r2d #c {
      opacity: 1; border-radius: 14px; border: 1px solid var(--line);
      box-shadow: 0 0 40px rgba(78,205,196,0.15);
    }

    /* ── Barra superior ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--top-h); z-index: 60;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 28px; padding-left: max(28px, env(safe-area-inset-left)); padding-right: max(28px, env(safe-area-inset-right));
      background: rgba(11,10,20,0.6); border-bottom: 1px solid var(--line);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .back { font-size: 15px; font-weight: 600; color: var(--muted); text-decoration: none; white-space: nowrap; border-radius: 6px; }
    .back:hover { color: #fff; }
    .title {
      position: absolute; left: 50%; transform: translateX(-50%); margin: 0; white-space: nowrap;
      font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: 2px;
    }
    .title small { font-size: 13px; color: var(--accent-text); letter-spacing: 1px; }
    .chip {
      height: 32px; padding: 0 12px; border-radius: 999px; white-space: nowrap;
      background: var(--surface-2); border: 1px solid var(--line);
      font-size: 13px; font-weight: 700; display: flex; align-items: center;
    }

    /* ── HUD: jugadores + tiempo ── */
    #hud {
      position: fixed; top: var(--top-h); left: 0; right: 0; z-index: 55;
      display: flex; align-items: center; gap: 18px; padding: 18px 28px 0;
      pointer-events: none;
    }
    .pchip {
      display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; flex: none;
      border-radius: 12px; background: rgba(23,22,31,0.85); border: 1px solid var(--line);
    }
    .sw { width: 22px; height: 22px; border-radius: 6px; flex: none; display: inline-block; }
    .sw.p1 { background: var(--p1); box-shadow: 0 0 12px rgba(255,107,107,0.45); }
    .sw.p2 { background: var(--p2); box-shadow: 0 0 12px rgba(78,205,196,0.45); }
    .pname { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .pn-short { display: none; }
    .icons { display: flex; gap: 3px; align-items: center; min-width: 16px; }
    .icons svg { width: 16px; height: 16px; display: block; }
    .icons.p1 { color: var(--p1); }
    .icons.p2 { color: var(--p2); }
    .icons .sh { color: var(--gold); filter: drop-shadow(0 0 4px rgba(241,196,15,0.6)); }
    .lv-full { display: inline-flex; gap: 3px; align-items: center; }
    .lv-compact { display: none; gap: 3px; align-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
    #timer { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .t-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
    #time-val {
      font-family: var(--font-display); font-size: 18px; font-weight: 700; line-height: 1;
      color: var(--gold); font-variant-numeric: tabular-nums;
    }
    .t-track { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
    #time-fill {
      height: 100%; width: 100%; border-radius: 999px; background: var(--gold);
      transform-origin: 0 50%;
    }
    #timer.low #time-val { color: var(--danger); }
    #timer.low #time-fill { background: #e74c3c; box-shadow: 0 0 12px rgba(231,76,60,0.8); }
    #timer.inf #time-val { color: var(--p2-soft); font-size: 15px; }
    #timer.inf #time-fill { background: linear-gradient(90deg, rgba(78,205,196,0.35), rgba(143,240,232,0.6)); }

    /* ── Mensaje de objetivo y teclas ── */
    #goal {
      position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 40;
      height: 44px; padding: 0 28px; border-radius: 999px; white-space: nowrap;
      background: rgba(23,22,31,0.9); border: 1px solid var(--line-strong);
      display: flex; align-items: center; font-size: 15px; font-weight: 700;
      pointer-events: none;
    }
    #goal[hidden] { display: none; }
    #keys {
      position: fixed; left: 28px; right: 28px; bottom: 16px; z-index: 40;
      display: flex; justify-content: space-between; font-size: 13px; color: var(--muted);
      pointer-events: none;
    }
    #keys > span { display: flex; align-items: center; gap: 6px; }
    .kbd {
      height: 26px; padding: 0 10px; border-radius: 6px; white-space: nowrap;
      background: var(--surface-2); border: 1px solid var(--line-strong);
      font-weight: 700; display: inline-flex; align-items: center;
    }
    .kbd.k1 { color: var(--p1-soft); }
    .kbd.k2 { color: var(--p2-soft); }

    /* ── Tarjetas (tutorial / victoria / tiempo agotado / completado) ── */
    #overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: calc(var(--top-h) + 12px) 16px calc(var(--play-bottom, 0px) + 16px);
      background: rgba(8,8,16,0.45); cursor: pointer;
    }
    #overlay[hidden] { display: none; }
    .card {
      width: min(440px, 100%); max-height: 100%; overflow: auto; cursor: default;
      padding: 26px 28px 20px; border-radius: 22px; text-align: center;
      background: rgba(23,22,31,0.95); border: 1px solid var(--line-strong);
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      animation: card-in 0.28s ease-out both;
    }
    #overlay.st-win .card { animation-delay: 0.45s; }
    @keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
    .card-icon { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; }
    .card-icon svg { width: 64px; height: 64px; display: block; }
    .card h2 { margin: 0; font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.1; }
    .card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
    #overlay.st-win h2 { color: var(--p2-soft); }
    #overlay.st-lost h2 { color: var(--danger); }
    #overlay.st-complete h2 { color: var(--gold); }
    #ov-extra { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    #ov-extra:empty { display: none; }
    .howto { list-style: none; margin: 4px 0 0; padding: 0; width: 100%; display: grid; gap: 8px; }
    .howto li {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; text-align: left;
    }
    .howto li b { flex: 1; }
    .howto .ico { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex: none; }
    .howto .ico svg { width: 18px; height: 18px; }
    .howto .note { color: var(--muted); font-size: 13px; }
    .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 13px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend svg { width: 15px; height: 15px; }
    .btn {
      min-height: 48px; padding: 0 26px; margin-top: 4px; border: 0; border-radius: 14px; cursor: pointer;
      background: var(--accent); color: #fff; font-weight: 700; font-size: 16px;
      box-shadow: 0 10px 30px rgba(124,77,255,0.35);
    }
    .btn:hover { background: var(--accent-hover); }
    .card-hint { font-size: 12px !important; }
    .only-touch { display: none; }

    /* ── Controles táctiles: un grupo por jugador ── */
    #mobile-controls {
      display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
      justify-content: space-between; align-items: flex-end; gap: 8px;
      padding: 8px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      background: rgba(11,10,20,0.78); border-top: 1px solid var(--line);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      pointer-events: none;
    }
    .mc-group {
      pointer-events: auto; display: grid; gap: 6px; align-items: end;
      grid-template-columns: var(--mc) var(--mc) calc(var(--mc) * 1.12);
      grid-template-areas: "tag tag tag" "l r j";
    }
    .mc-group.p2 { grid-template-columns: calc(var(--mc) * 1.12) var(--mc) var(--mc); grid-template-areas: "tag tag tag" "j l r"; }
    .mc-tag {
      grid-area: tag; display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase;
    }
    .mc-group.p2 .mc-tag { justify-content: flex-end; }
    .mc-tag .sw { width: 12px; height: 12px; border-radius: 4px; }
    .mc-btn {
      width: var(--mc); height: var(--mc); padding: 0; border-radius: 14px; cursor: pointer;
      border: 1px solid var(--line-strong); background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
      transition: transform 0.08s ease, background-color 0.08s ease;
    }
    .mc-btn svg { width: 26px; height: 26px; pointer-events: none; }
    .mc-l { grid-area: l; } .mc-r { grid-area: r; }
    .mc-jump { grid-area: j; width: calc(var(--mc) * 1.12); height: calc(var(--mc) * 1.12); border-radius: 18px; }
    .mc-group.p1 .mc-btn { color: var(--p1-soft); }
    .mc-group.p2 .mc-btn { color: var(--p2-soft); }
    .mc-group.p1 .mc-jump { background: rgba(255,107,107,0.16); border-color: rgba(255,107,107,0.5); }
    .mc-group.p2 .mc-jump { background: rgba(78,205,196,0.16); border-color: rgba(78,205,196,0.5); }
    .mc-btn.pressed { transform: scale(0.93); }
    .mc-group.p1 .mc-btn.pressed { background: rgba(255,107,107,0.38); border-color: var(--p1); }
    .mc-group.p2 .mc-btn.pressed { background: rgba(78,205,196,0.38); border-color: var(--p2); }

    @media (hover: none) and (pointer: coarse) {
      #mobile-controls { display: flex; }
      #goal { top: calc(var(--play-top, 120px) + 10px); bottom: auto; }
      #keys { display: none; }
      .only-touch { display: revert; }
      .only-keys { display: none !important; }
    }

    /* ── Pantallas estrechas ── */
    @media (max-width: 720px) {
      :root { --top-h: 52px; }
      #topbar { padding: 0 14px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
      .back { font-size: 14px; }
      .title { font-size: 17px; letter-spacing: 1px; }
      .title small { font-size: 11px; }
      .chip { height: 28px; padding: 0 10px; font-size: 12px; }
      #hud { gap: 10px; padding: 10px 14px 0; }
      .pchip { height: 40px; padding: 0 10px; gap: 7px; }
      .pn-long { display: none; }
      .pn-short { display: inline; }
      .t-row { font-size: 12px; }
      #goal { height: 36px; padding: 0 16px; font-size: 13px; }
      .card { padding: 22px 18px 16px; }
      .card h2 { font-size: 28px; }
    }
    @media (max-width: 480px) {
      #topbar { gap: 8px; }
      .title { position: static; transform: none; font-size: 15px; letter-spacing: 1px; }
      .back { font-size: 13px; }
      .chip { height: 26px; padding: 0 8px; font-size: 11px; }
      .pname { display: none; }
      .lv-full { display: none; }
      .lv-compact { display: inline-flex; }
      #hud { gap: 8px; }
    }
    @media (max-width: 350px) {
      .back-txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    }

    /* ── Móvil en horizontal: controles a los lados y HUD dentro de la barra superior ── */
    body.mc-lateral { --top-h: 48px; }
    body.mc-lateral .title { display: none; }
    body.mc-lateral #hud { top: 0; height: var(--top-h); padding: 0; left: 150px; right: 150px; gap: 10px; z-index: 65; }
    body.mc-lateral .chip { height: 28px; padding: 0 10px; font-size: 12px; }
    body.mc-lateral .pchip { height: 34px; }
    body.mc-lateral .pname { display: none; }
    body.mc-lateral .t-row { display: none; }
    body.mc-lateral #timer { flex-direction: row; align-items: center; gap: 8px; }
    body.mc-lateral #timer .t-track { flex: 1; }
    body.mc-lateral #timer .t-lateral { display: block; }
    .t-lateral { display: none; font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--gold); min-width: 3.4em; text-align: right; font-variant-numeric: tabular-nums; }
    body.mc-lateral #timer.low .t-lateral { color: var(--danger); }
    body.mc-lateral #timer.inf .t-lateral { color: var(--p2-soft); font-size: 12px; min-width: 0; }
    body.mc-lateral #mobile-controls { background: transparent; border: 0; -webkit-backdrop-filter: none; backdrop-filter: none; }
    body.mc-lateral .mc-group,
    body.mc-lateral .mc-group.p2 {
      grid-template-columns: var(--mc) var(--mc);
      grid-template-areas: "tag tag" "j j" "l r";
    }
    body.mc-lateral .mc-jump { width: 100%; }
    body.mc-lateral #overlay { padding-left: 140px; padding-right: 140px; }

    @media (prefers-reduced-motion: reduce) {
      .mc-btn, .mc-btn.pressed { transition: none; transform: none; }
      .card { animation: none; }
    }
  </style>
</head>
<body>

<div id="bg-grid" aria-hidden="true"></div>
<canvas id="c" role="img" aria-label="Ambidextro 3D: escenario de plataformas donde el Jugador 1 (cubo rojo) y el Jugador 2 (cubo turquesa) deben saltar hasta tocarse"></canvas>

<header id="topbar">
  <a class="back" href="../">← <span class="back-txt">PimpoliDev</span></a>
  <h1 class="title">AMBIDEXTRO <small>3D</small></h1>
  <span id="level-chip" class="chip">Nivel 1 / 25</span>
</header>

<div id="hud">
  <div class="pchip">
    <span class="sw p1" aria-hidden="true"></span>
    <span class="pname"><span class="pn-long">Jugador 1</span><span class="pn-short" aria-hidden="true">J1</span></span>
    <span class="icons p1" id="p1-icons" role="img" aria-label="Jugador 1: 3 vidas"></span>
  </div>
  <div id="timer" role="timer" aria-label="Tiempo restante">
    <div class="t-row"><span>Tiempo</span><span id="time-val">Sin límite</span></div>
    <div class="t-track"><div id="time-fill"></div></div>
    <span class="t-lateral" id="time-val-lat" aria-hidden="true"></span>
  </div>
  <div class="pchip">
    <span class="icons p2" id="p2-icons" role="img" aria-label="Jugador 2: 3 vidas"></span>
    <span class="pname"><span class="pn-long">Jugador 2</span><span class="pn-short" aria-hidden="true">J2</span></span>
    <span class="sw p2" aria-hidden="true"></span>
  </div>
</div>

<div id="goal" hidden>¡Tócate con tu compañero para ganar!</div>

<div id="keys" aria-hidden="true">
  <span><span class="kbd k1">A · W · D</span>Jugador 1</span>
  <span>Jugador 2<span class="kbd k2">← ↑ →</span></span>
</div>

<div id="overlay" hidden>
  <div class="card" role="dialog" aria-labelledby="ov-title" aria-describedby="ov-text">
    <div class="card-icon" id="ov-icon" aria-hidden="true"></div>
    <h2 id="ov-title"></h2>
    <p id="ov-text"></p>
    <div id="ov-extra"></div>
    <button id="ov-btn" class="btn" type="button"></button>
    <p class="card-hint"><span class="only-keys">Enter / Espacio para continuar</span><span class="only-touch">o toca la pantalla para continuar</span></p>
  </div>
</div>

<p id="sr-status" class="sr-only" aria-live="polite" aria-atomic="true"></p>

<!-- Controles táctiles: Jugador 1 a la izquierda, Jugador 2 a la derecha -->
<div id="mobile-controls">
  <div class="mc-group p1" role="group" aria-label="Controles del Jugador 1">
    <span class="mc-tag"><span class="sw p1"></span>Jugador 1</span>
    <button type="button" class="mc-btn mc-l" id="mc-p1-left" aria-label="Jugador 1: izquierda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="mc-btn mc-r" id="mc-p1-right" aria-label="Jugador 1: derecha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="mc-btn mc-jump" id="mc-p1-jump" aria-label="Jugador 1: saltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="mc-group p2" role="group" aria-label="Controles del Jugador 2">
    <span class="mc-tag">Jugador 2<span class="sw p2"></span></span>
    <button type="button" class="mc-btn mc-jump" id="mc-p2-jump" aria-label="Jugador 2: saltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="mc-btn mc-l" id="mc-p2-left" aria-label="Jugador 2: izquierda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="mc-btn mc-r" id="mc-p2-right" aria-label="Jugador 2: derecha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<noscript><p style="position:fixed;inset:40% 16px auto;text-align:center;">Activa JavaScript para jugar a Ambidextro.</p></noscript>

<script type="importmap">
  { "imports": { "three": "../js/vendor/three.module.min.js", "three/addons/": "../js/vendor/addons/" } }
</script>
<script type="module" src="game.js"></script>
<script src="../js/destroygame.js" defer></script>
</body>
</html>
