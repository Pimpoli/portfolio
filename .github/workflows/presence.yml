name: Update Roblox Presence & Data

# Publica en data/presence.json el tipo de estado (0 desconectado, 1 en línea, 2 jugando,
# 3 en Studio), la hora y, solo si está jugando, el juego (nombre y placeId).
# Nunca el servidor (gameId), que permitiría entrar en tu mismo servidor, ni el lugar
# abierto en Studio, que podría ser un proyecto sin publicar.

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub puede retrasar las ejecuciones programadas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: presence
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch & write presence
        env:
          # Recomendado: API key de Open Cloud (no caduca y no da acceso a la cuenta).
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          # Alternativa: cookie .ROBLOSECURITY. Da acceso completo a la cuenta; mejor la de una cuenta secundaria.
          ROBLOX_COOKIE:  ${{ secrets.ROBLOX_COOKIE }}
        run: |
          USER_ID=3404416545
          SUCCESS=false

          # Consulta presence.roblox.com con las cabeceras dadas y guarda el estado (sin gameId)
          call_presence_api() {
            local label="$1"; shift
            echo "--- Trying: $label ---"
            HTTP_CODE=$(curl -s -o /tmp/rbx_response.json -w "%{http_code}" --max-time 15 \
              -X POST "https://presence.roblox.com/v1/presence/users" \
              -H "Content-Type: application/json" -H "Accept: application/json" \
              "$@" -d "{\"userIds\":[$USER_ID]}")
            echo "HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && jq -e '.userPresences[0].userPresenceType | numbers' /tmp/rbx_response.json > /dev/null 2>&1; then
              jq --arg ts "$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")" \
                '.userPresences[0] as $p
                 | { userPresenceType: $p.userPresenceType, updatedAt: $ts }
                 + (if $p.userPresenceType == 2
                    then { lastLocation: $p.lastLocation, placeId: $p.placeId, rootPlaceId: $p.rootPlaceId, universeId: $p.universeId }
                    else {} end)' \
                /tmp/rbx_response.json > data/presence.json
              echo "✓ $label succeeded"
              return 0
            fi
            echo "✗ $label failed"
            return 1
          }

          # Método 1: API key de Open Cloud
          if [ -n "$ROBLOX_API_KEY" ]; then
            call_presence_api "Open Cloud API key" -H "x-api-key: ${ROBLOX_API_KEY}" && SUCCESS=true
          fi

          # Método 2: cookie + token CSRF
          if [ "$SUCCESS" = "false" ] && [ -n "$ROBLOX_COOKIE" ]; then
            CSRF=$(curl -si --max-time 15 -X POST "https://auth.roblox.com/v2/logout" \
              -H "Content-Type: application/json" \
              -H "Cookie: .ROBLOSECURITY=${ROBLOX_COOKIE}" \
              | grep -i "x-csrf-token:" | awk '{print $2}' | tr -d '\r\n')
            call_presence_api "Cookie + CSRF" \
              -H "Cookie: .ROBLOSECURITY=${ROBLOX_COOKIE}" \
              -H "x-csrf-token: ${CSRF}" \
              && SUCCESS=true
          fi

          rm -f /tmp/rbx_response.json

          # Si todo falla NO se escribe nada: la web ignora un presence.json de más de 60 min
          # y usa sus propios métodos, en lugar de mostrar un estado inventado.
          if [ "$SUCCESS" = "false" ]; then
            echo "::warning::All presence methods failed; data/presence.json left unchanged."
          else
            echo "--- Final presence.json ---"
            cat data/presence.json
          fi

      # Copia de los datos públicos de Roblox (juegos, portadas, avatar…) para que la web
      # no dependa de roproxy. Si falla, se conserva la copia anterior y no rompe el resto.
      - name: Fetch Roblox games & profile
        continue-on-error: true
        run: node scripts/fetch-roblox.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/presence.json
          if [ -f data/roblox.json ]; then git add data/roblox.json; fi
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update presence and Roblox data [skip ci]"
            git pull --rebase origin main
            git push
          fi
